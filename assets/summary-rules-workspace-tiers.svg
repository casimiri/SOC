<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="42" font-size="26" font-weight="600" fill="#1e1e1e" text-anchor="middle">Summary Rules, Workspace Tiers and Entity Tables</text>

  <!-- Analytics tier zone -->
  <rect x="280" y="90" width="620" height="180" rx="14" fill="#dbe4ff" opacity="0.45" stroke="#4a9eed"/>
  <text x="300" y="118" font-size="16" font-weight="600" fill="#2563eb">Analytics tier — interactive KQL, analytics rules</text>
  <rect x="310" y="160" width="220" height="70" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="190" font-size="15" fill="#1e1e1e" text-anchor="middle">Log tables</text>
  <text x="420" y="210" font-size="13" fill="#444" text-anchor="middle">(e.g. SigninLogs, SecurityEvent)</text>
  <rect x="620" y="160" width="250" height="70" rx="10" fill="#b2f2bb" stroke="#15803d" stroke-width="2"/>
  <text x="745" y="190" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">Summary rule table</text>
  <text x="745" y="210" font-size="13" fill="#444" text-anchor="middle">(aggregates, queryable + detectable)</text>

  <!-- Connectors -->
  <rect x="40" y="160" width="180" height="65" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="198" font-size="15" fill="#1e1e1e" text-anchor="middle">Data connectors</text>
  <line x1="220" y1="192" x2="305" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="182" font-size="13" fill="#2563eb" text-anchor="middle">ingest</text>

  <!-- Summary rule -->
  <rect x="560" y="300" width="290" height="70" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="705" y="330" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">Summary rule</text>
  <text x="705" y="350" font-size="13" fill="#444" text-anchor="middle">scheduled KQL aggregation (20 min – 24 h)</text>

  <!-- KQL jobs note -->
  <text x="50" y="310" font-size="14" fill="#757575">KQL jobs: on-demand queries</text>
  <text x="50" y="330" font-size="14" fill="#757575">over lake data, results also</text>
  <text x="50" y="350" font-size="14" fill="#757575">land in Analytics-tier tables</text>

  <!-- Data lake zone -->
  <rect x="280" y="400" width="620" height="210" rx="14" fill="#d3f9d8" opacity="0.45" stroke="#22c55e"/>
  <text x="300" y="428" font-size="16" font-weight="600" fill="#15803d">Data lake tier — low cost, retention up to 12 years</text>
  <rect x="310" y="470" width="220" height="70" rx="10" fill="#c3fae8" stroke="#0d9488" stroke-width="2"/>
  <text x="420" y="500" font-size="15" fill="#1e1e1e" text-anchor="middle">Raw log tables</text>
  <text x="420" y="520" font-size="13" fill="#444" text-anchor="middle">(mirrored, not interactive)</text>
  <rect x="620" y="470" width="250" height="80" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
  <text x="745" y="500" font-size="15" fill="#1e1e1e" text-anchor="middle">Entity tables</text>
  <text x="745" y="520" font-size="13" fill="#444" text-anchor="middle">(IdentityInfo, devices, apps)</text>
  <text x="745" y="540" font-size="12.5" fill="#444" text-anchor="middle">feeds Sentinel Graph / UEBA</text>

  <!-- mirrored arrow -->
  <line x1="420" y1="230" x2="420" y2="465" stroke="#757575" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="455" y="395" font-size="13" fill="#757575" text-anchor="middle">mirrored</text>

  <!-- reads arrow: raw lake -> summary rule -->
  <line x1="535" y1="480" x2="625" y2="375" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="555" y="435" font-size="13" fill="#6d28d9" text-anchor="middle">reads</text>

  <!-- writes arrow: summary rule -> summary table -->
  <line x1="715" y1="300" x2="730" y2="235" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>
  <text x="755" y="272" font-size="13" fill="#15803d" text-anchor="middle">writes</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
