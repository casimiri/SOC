<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="38" font-size="22" font-weight="600" fill="#1e1e1e" text-anchor="middle">On-prem Servers → Azure Arc → AMA → Sentinel Ingestion</text>

  <!-- On-prem -->
  <rect x="40" y="100" width="210" height="120" rx="12" fill="#dbe4ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="145" y="155" font-size="14" fill="#1e1e1e" text-anchor="middle">On-premises servers</text>
  <text x="145" y="177" font-size="14" fill="#1e1e1e" text-anchor="middle">(Windows)</text>

  <!-- Steps 1-3 -->
  <rect x="320" y="110" width="230" height="80" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="435" y="143" font-size="13" fill="#1e1e1e" text-anchor="middle">1. Install Azure Connected</text>
  <text x="435" y="163" font-size="13" fill="#1e1e1e" text-anchor="middle">Machine agent (Arc)</text>
  <line x1="250" y1="155" x2="315" y2="150" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="282" y="142" font-size="12" fill="#6d28d9" text-anchor="middle">onboard</text>

  <rect x="320" y="245" width="230" height="70" rx="10" fill="#c3fae8" stroke="#0d9488" stroke-width="2"/>
  <text x="435" y="275" font-size="13" fill="#1e1e1e" text-anchor="middle">2. Becomes an Azure resource</text>
  <text x="435" y="295" font-size="13" fill="#1e1e1e" text-anchor="middle">(Arc-enabled)</text>
  <line x1="435" y1="190" x2="435" y2="245" stroke="#0d9488" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="320" y="365" width="230" height="60" rx="10" fill="#c3fae8" stroke="#0d9488" stroke-width="2"/>
  <text x="435" y="400" font-size="13" fill="#1e1e1e" text-anchor="middle">3. Appears in resource picker</text>
  <line x1="435" y1="315" x2="435" y2="365" stroke="#0d9488" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Connector workflow -->
  <rect x="610" y="90" width="270" height="370" rx="14" fill="#ffd8a8" opacity="0.35" stroke="#f59e0b"/>
  <text x="630" y="117" font-size="15" font-weight="600" fill="#b45309">Sentinel connector workflow</text>
  <rect x="630" y="135" width="230" height="75" rx="8" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="745" y="165" font-size="12.5" fill="#1e1e1e" text-anchor="middle">4. Windows Security Events</text>
  <text x="745" y="185" font-size="12.5" fill="#1e1e1e" text-anchor="middle">via AMA connector — select servers</text>
  <rect x="630" y="235" width="230" height="80" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="745" y="268" font-size="13" fill="#1e1e1e" text-anchor="middle">5. Create DCR + deploy</text>
  <text x="745" y="288" font-size="13" fill="#1e1e1e" text-anchor="middle">Azure Monitor Agent</text>
  <rect x="630" y="345" width="230" height="70" rx="8" fill="#b2f2bb" stroke="#15803d" stroke-width="2"/>
  <text x="745" y="378" font-size="13" fill="#1e1e1e" text-anchor="middle">6. Events flow to</text>
  <text x="745" y="398" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">SecurityEvent table</text>

  <line x1="550" y1="395" x2="628" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="588" y="300" font-size="12" fill="#946000" text-anchor="middle">targetable</text>
  <line x1="745" y1="210" x2="745" y2="235" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="315" x2="745" y2="345" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Note -->
  <text x="40" y="500" font-size="14" fill="#757575">Arc is the prerequisite: it makes a non-Azure server a first-class Azure resource, so</text>
  <text x="40" y="522" font-size="14" fill="#757575">DCRs and AMA-based connectors can target it just like an Azure VM.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
