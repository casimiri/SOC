<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="42" font-size="24" font-weight="600" fill="#1e1e1e" text-anchor="middle">From Alert Process Tree to the IP Address Entity Page</text>

  <!-- Process tree zone -->
  <rect x="40" y="90" width="350" height="360" rx="14" fill="#dbe4ff" opacity="0.35" stroke="#4a9eed"/>
  <text x="60" y="118" font-size="16" font-weight="600" fill="#2563eb">Alert page — process tree</text>
  <rect x="60" y="140" width="210" height="50" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="170" font-size="14" fill="#1e1e1e" text-anchor="middle">winword.exe</text>
  <rect x="90" y="220" width="210" height="50" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="250" font-size="14" fill="#1e1e1e" text-anchor="middle">powershell.exe -enc ...</text>
  <rect x="120" y="310" width="250" height="70" rx="8" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="245" y="340" font-size="13" fill="#1e1e1e" text-anchor="middle">Network connection:</text>
  <text x="245" y="362" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">185.220.101.34 (external IP)</text>
  <line x1="165" y1="190" x2="185" y2="215" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="195" y1="270" x2="220" y2="305" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="370" y1="340" x2="465" y2="300" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="418" y="305" font-size="14" fill="#b91c1c" text-anchor="middle">select the IP</text>

  <!-- Entity page zone -->
  <rect x="480" y="80" width="450" height="500" rx="14" fill="#d3f9d8" opacity="0.35" stroke="#22c55e"/>
  <text x="500" y="108" font-size="17" font-weight="600" fill="#15803d">IP address entity page</text>
  <rect x="500" y="130" width="410" height="70" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="160" font-size="13" fill="#1e1e1e" text-anchor="middle">Overview: TI reputation, geolocation,</text>
  <text x="705" y="180" font-size="13" fill="#1e1e1e" text-anchor="middle">WHOIS / registrar context</text>
  <rect x="500" y="215" width="410" height="70" rx="8" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="705" y="245" font-size="13" fill="#1e1e1e" text-anchor="middle">Incidents &amp; alerts involving this IP</text>
  <text x="705" y="265" font-size="13" fill="#1e1e1e" text-anchor="middle">across the tenant</text>
  <rect x="500" y="300" width="410" height="80" rx="8" fill="#c3fae8" stroke="#0d9488" stroke-width="2"/>
  <text x="705" y="330" font-size="13" fill="#1e1e1e" text-anchor="middle">Observed in organization: which devices</text>
  <text x="705" y="350" font-size="13" fill="#1e1e1e" text-anchor="middle">communicated with it, prevalence,</text>
  <text x="705" y="370" font-size="13" fill="#1e1e1e" text-anchor="middle">first / last seen</text>
  <rect x="500" y="395" width="410" height="80" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="705" y="425" font-size="13" fill="#1e1e1e" text-anchor="middle">Pivot actions: Add indicator (block IP),</text>
  <text x="705" y="445" font-size="13" fill="#1e1e1e" text-anchor="middle">Go hunt (Advanced Hunting)</text>
  <text x="705" y="515" font-size="13" fill="#757575" text-anchor="middle">related activity, alerts and context — investigated</text>
  <text x="705" y="535" font-size="13" fill="#757575" text-anchor="middle">directly from the incident evidence, no portal hopping</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
