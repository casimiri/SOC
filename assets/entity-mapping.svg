<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="38" font-size="23" font-weight="600" fill="#1e1e1e" text-anchor="middle">Entity Mapping in Analytics Rules</text>

  <!-- Query columns -->
  <rect x="50" y="100" width="210" height="70" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="155" y="140" font-size="13" fill="#1e1e1e" text-anchor="middle">KQL query result columns</text>

  <!-- Mapping -->
  <rect x="320" y="95" width="230" height="85" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="3"/>
  <text x="435" y="130" font-size="13" fill="#1e1e1e" text-anchor="middle">Entity mapping:</text>
  <text x="435" y="150" font-size="13" fill="#1e1e1e" text-anchor="middle">map columns → entity identifiers</text>
  <line x1="260" y1="135" x2="315" y2="137" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="288" y="127" font-size="12" fill="#6d28d9" text-anchor="middle">map</text>

  <!-- Entities -->
  <rect x="320" y="225" width="230" height="155" rx="12" fill="#c3fae8" opacity="0.35" stroke="#0d9488"/>
  <text x="340" y="252" font-size="14" font-weight="600" fill="#0d9488">Entities (e.g.)</text>
  <rect x="340" y="265" width="95" height="42" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="387" y="291" font-size="12" fill="#1e1e1e" text-anchor="middle">Account</text>
  <rect x="445" y="265" width="95" height="42" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="492" y="291" font-size="12" fill="#1e1e1e" text-anchor="middle">Host</text>
  <rect x="340" y="318" width="95" height="42" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="387" y="344" font-size="12" fill="#1e1e1e" text-anchor="middle">IP</text>
  <rect x="445" y="318" width="95" height="42" rx="8" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="492" y="344" font-size="12" fill="#1e1e1e" text-anchor="middle">File / URL</text>
  <line x1="435" y1="180" x2="435" y2="225" stroke="#0d9488" stroke-width="2" marker-end="url(#arr)"/>
  <text x="478" y="207" font-size="12" fill="#0d9488" text-anchor="middle">produces</text>

  <!-- Output -->
  <rect x="630" y="225" width="240" height="155" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="750" y="270" font-size="13" fill="#1e1e1e" text-anchor="middle">Enriches alerts &amp; incidents:</text>
  <text x="750" y="293" font-size="13" fill="#1e1e1e" text-anchor="middle">entity pages, graph, UEBA,</text>
  <text x="750" y="316" font-size="13" fill="#1e1e1e" text-anchor="middle">alert grouping, automation</text>
  <text x="750" y="345" font-size="12" fill="#444" text-anchor="middle">— the basis for investigation</text>
  <text x="750" y="363" font-size="12" fill="#444" text-anchor="middle">&amp; response</text>
  <line x1="550" y1="302" x2="625" y2="302" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="587" y="293" font-size="12" fill="#b91c1c" text-anchor="middle">enriches</text>

  <!-- Availability -->
  <rect x="50" y="410" width="820" height="150" rx="12" fill="#f8f9fa" stroke="#9e9e9e"/>
  <text x="70" y="438" font-size="15" font-weight="600" fill="#495057">Where entity mapping is available</text>
  <rect x="70" y="455" width="180" height="50" rx="8" fill="#b2f2bb" stroke="#15803d" stroke-width="2"/>
  <text x="160" y="486" font-size="14" fill="#1e1e1e" text-anchor="middle">Scheduled  ✓</text>
  <rect x="270" y="455" width="180" height="50" rx="8" fill="#b2f2bb" stroke="#15803d" stroke-width="2"/>
  <text x="360" y="486" font-size="14" fill="#1e1e1e" text-anchor="middle">NRT  ✓</text>
  <rect x="470" y="455" width="180" height="50" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
  <text x="560" y="486" font-size="13" fill="#1e1e1e" text-anchor="middle">TI / Fusion  ✗</text>
  <rect x="670" y="455" width="180" height="50" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
  <text x="760" y="486" font-size="13" fill="#1e1e1e" text-anchor="middle">ML / Anomaly  ✗</text>
  <text x="70" y="535" font-size="13" fill="#757575">Entity mapping is available ONLY in Scheduled and NRT analytics rules — the two types where you author the KQL.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
