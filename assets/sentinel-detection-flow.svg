<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="42" font-size="26" font-weight="600" fill="#1e1e1e" text-anchor="middle">Sentinel Detection Flow</text>

  <!-- Inputs -->
  <rect x="40" y="200" width="200" height="70" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="230" font-size="15" fill="#1e1e1e" text-anchor="middle">Log data</text>
  <text x="140" y="250" font-size="13" fill="#444" text-anchor="middle">(workspace tables)</text>

  <rect x="40" y="340" width="200" height="80" rx="10" fill="#c3fae8" stroke="#0d9488" stroke-width="2"/>
  <text x="140" y="372" font-size="15" fill="#1e1e1e" text-anchor="middle">Threat intelligence</text>
  <text x="140" y="392" font-size="13" fill="#444" text-anchor="middle">(ingested indicators)</text>

  <!-- Analytics rule zone -->
  <rect x="300" y="120" width="290" height="350" rx="14" fill="#fff3bf" opacity="0.45" stroke="#f59e0b"/>
  <text x="320" y="150" font-size="17" font-weight="600" fill="#b45309">Analytics Rule</text>
  <rect x="330" y="180" width="230" height="65" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="445" y="218" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">KQL query</text>
  <rect x="330" y="285" width="230" height="95" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="445" y="320" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">Detection logic</text>
  <text x="445" y="342" font-size="13" fill="#444" text-anchor="middle">severity, entity mapping,</text>
  <text x="445" y="360" font-size="13" fill="#444" text-anchor="middle">MITRE tactics</text>
  <text x="320" y="448" font-size="13" fill="#757575">Types: Scheduled | NRT | TI | ML | Fusion</text>

  <!-- Arrows in -->
  <line x1="240" y1="225" x2="325" y2="213" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="282" y="202" font-size="13" fill="#2563eb" text-anchor="middle">runs against</text>
  <line x1="240" y1="375" x2="325" y2="340" stroke="#0d9488" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="372" font-size="13" fill="#0d9488" text-anchor="middle">TI rule match</text>

  <!-- Alert -->
  <rect x="680" y="180" width="170" height="70" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="765" y="222" font-size="17" font-weight="600" fill="#1e1e1e" text-anchor="middle">Alert</text>
  <line x1="560" y1="213" x2="675" y2="213" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="618" y="202" font-size="13" fill="#b91c1c" text-anchor="middle">results found</text>

  <!-- Incident -->
  <rect x="675" y="370" width="180" height="70" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="765" y="412" font-size="17" font-weight="600" fill="#1e1e1e" text-anchor="middle">Incident</text>
  <line x1="765" y1="250" x2="765" y2="365" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="800" y="312" font-size="13" fill="#b45309" text-anchor="middle">grouping</text>

  <text x="675" y="475" font-size="13" fill="#757575">Automation rules + playbooks react here</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
