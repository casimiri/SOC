<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="42" font-size="24" font-weight="600" fill="#1e1e1e" text-anchor="middle">Device Page Timeline Tab: Events Before an Alert</text>

  <!-- Alert -->
  <rect x="40" y="160" width="240" height="90" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="197" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">High-severity alert</text>
  <text x="160" y="219" font-size="14" fill="#1e1e1e" text-anchor="middle">triggered on Device X</text>

  <!-- Device page zone -->
  <rect x="350" y="90" width="570" height="500" rx="14" fill="#dbe4ff" opacity="0.35" stroke="#4a9eed"/>
  <text x="370" y="118" font-size="16" font-weight="600" fill="#2563eb">Device page (Microsoft Defender portal)</text>
  <line x1="280" y1="205" x2="345" y2="200" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="312" y="188" font-size="13" fill="#b91c1c" text-anchor="middle">investigate</text>

  <!-- Tabs -->
  <rect x="370" y="140" width="100" height="40" rx="8" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="420" y="165" font-size="13" fill="#444" text-anchor="middle">Overview</text>
  <rect x="480" y="140" width="90" height="40" rx="8" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="525" y="165" font-size="13" fill="#444" text-anchor="middle">Alerts</text>
  <rect x="580" y="140" width="110" height="40" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="635" y="165" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">Timeline</text>
  <rect x="700" y="140" width="130" height="40" rx="8" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="765" y="165" font-size="13" fill="#444" text-anchor="middle">Inventories...</text>

  <!-- Events before zone -->
  <rect x="365" y="210" width="540" height="210" rx="10" fill="#b2f2bb" opacity="0.3" stroke="#15803d" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="380" y="232" font-size="14" font-weight="600" fill="#15803d">Events BEFORE the alert — scroll back in time</text>

  <rect x="380" y="245" width="510" height="45" rx="8" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="395" y="273" font-size="13" fill="#1e1e1e">10:04   Process created: powershell.exe -enc ...</text>
  <rect x="380" y="300" width="510" height="45" rx="8" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="395" y="328" font-size="13" fill="#1e1e1e">10:05   Network connection: 185.220.x.x:443</text>
  <rect x="380" y="355" width="510" height="45" rx="8" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="395" y="383" font-size="13" fill="#1e1e1e">10:06   File created: payload.dll</text>

  <!-- Alert row -->
  <rect x="380" y="445" width="510" height="50" rx="8" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="395" y="476" font-size="13" font-weight="600" fill="#1e1e1e">10:07   ALERT: Suspicious process injection (High)</text>
  <line x1="905" y1="470" x2="905" y2="300" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Notes -->
  <text x="380" y="530" font-size="13" fill="#757575">Search &amp; filter by event group / MITRE technique · flag events · export to CSV</text>
  <text x="380" y="552" font-size="13" fill="#757575">Device timeline keeps up to 6 months of history (widen the date picker for older context)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
