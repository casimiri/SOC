<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="40" font-size="24" font-weight="600" fill="#1e1e1e" text-anchor="middle">Identity-to-SOC: On-Prem AD &amp; Entra ID → Defender → Sentinel</text>

  <!-- IDENTITY SOURCES (bottom) -->
  <rect x="40" y="560" width="400" height="130" rx="14" fill="#dbe4ff" opacity="0.35" stroke="#4a9eed"/>
  <text x="60" y="588" font-size="15" font-weight="600" fill="#2563eb">Identity sources</text>
  <rect x="60" y="605" width="170" height="65" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="633" font-size="14" fill="#1e1e1e" text-anchor="middle">On-prem Active</text>
  <text x="145" y="652" font-size="14" fill="#1e1e1e" text-anchor="middle">Directory (AD DS)</text>
  <rect x="250" y="605" width="170" height="65" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="633" font-size="14" fill="#1e1e1e" text-anchor="middle">Microsoft</text>
  <text x="335" y="652" font-size="14" fill="#1e1e1e" text-anchor="middle">Entra ID (cloud)</text>
  <line x1="230" y1="637" x2="250" y2="637" stroke="#757575" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrGrey)" marker-start="url(#arrGreyStart)"/>
  <text x="240" y="600" font-size="10" fill="#757575" text-anchor="middle">Entra</text>
  <text x="240" y="690" font-size="10" fill="#757575" text-anchor="middle">Connect sync</text>

  <!-- DETECTION LAYER (middle) -->
  <rect x="40" y="350" width="400" height="170" rx="14" fill="#e5dbff" opacity="0.4" stroke="#8b5cf6"/>
  <text x="60" y="378" font-size="15" font-weight="600" fill="#6d28d9">Identity threat detection</text>
  <rect x="60" y="395" width="170" height="105" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="145" y="423" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">Defender for</text>
  <text x="145" y="442" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">Identity (MDI)</text>
  <text x="145" y="468" font-size="11" fill="#444" text-anchor="middle">sensor on domain</text>
  <text x="145" y="483" font-size="11" fill="#444" text-anchor="middle">controllers</text>
  <rect x="250" y="395" width="170" height="105" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="335" y="423" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">Entra ID</text>
  <text x="335" y="442" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">Protection</text>
  <text x="335" y="468" font-size="11" fill="#444" text-anchor="middle">risky sign-ins /</text>
  <text x="335" y="483" font-size="11" fill="#444" text-anchor="middle">risky users</text>
  <line x1="145" y1="605" x2="145" y2="503" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="100" y="555" font-size="11" fill="#6d28d9" text-anchor="middle">monitors</text>
  <line x1="335" y1="605" x2="335" y2="503" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="380" y="555" font-size="11" fill="#6d28d9" text-anchor="middle">scores risk</text>

  <!-- DEFENDER XDR -->
  <rect x="40" y="170" width="400" height="130" rx="14" fill="#c3fae8" opacity="0.4" stroke="#0d9488"/>
  <text x="60" y="198" font-size="15" font-weight="600" fill="#0d9488">Microsoft Defender XDR (tenant)</text>
  <rect x="60" y="215" width="360" height="70" rx="10" fill="#96f2d7" stroke="#0d9488" stroke-width="2"/>
  <text x="240" y="243" font-size="13" fill="#1e1e1e" text-anchor="middle">Correlates alerts across Identity, Endpoint, Office 365,</text>
  <text x="240" y="262" font-size="13" fill="#1e1e1e" text-anchor="middle">Cloud Apps → unified XDR incidents · Advanced Hunting</text>
  <line x1="145" y1="395" x2="145" y2="288" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="335" y1="395" x2="335" y2="288" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="240" y="330" font-size="11" fill="#0d9488" text-anchor="middle">alerts feed XDR correlation</text>

  <!-- SENTINEL -->
  <rect x="540" y="170" width="420" height="350" rx="14" fill="#ffd8a8" opacity="0.4" stroke="#f59e0b"/>
  <text x="560" y="198" font-size="15" font-weight="600" fill="#b45309">Microsoft Sentinel (SIEM · workspace)</text>
  <rect x="560" y="215" width="380" height="60" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="240" font-size="13" fill="#1e1e1e" text-anchor="middle">Defender XDR connector — ingests incidents,</text>
  <text x="750" y="259" font-size="13" fill="#1e1e1e" text-anchor="middle">alerts &amp; raw tables into the workspace</text>
  <rect x="560" y="290" width="380" height="55" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="314" font-size="13" fill="#1e1e1e" text-anchor="middle">SigninLogs · AuditLogs (Entra ID connector)</text>
  <text x="750" y="333" font-size="11" fill="#444" text-anchor="middle">SecurityEvent · IdentityDirectoryEvents · SecurityAlert</text>
  <rect x="560" y="360" width="185" height="55" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="652" y="384" font-size="12" fill="#1e1e1e" text-anchor="middle">Analytics rules ·</text>
  <text x="652" y="402" font-size="12" fill="#1e1e1e" text-anchor="middle">UEBA · hunting</text>
  <rect x="755" y="360" width="185" height="55" rx="10" fill="#b2f2bb" stroke="#15803d" stroke-width="2"/>
  <text x="847" y="384" font-size="12" fill="#1e1e1e" text-anchor="middle">Automation rules ·</text>
  <text x="847" y="402" font-size="12" fill="#1e1e1e" text-anchor="middle">playbooks</text>
  <rect x="560" y="430" width="380" height="70" rx="10" fill="#ffec99" stroke="#f59e0b" stroke-width="3"/>
  <text x="750" y="458" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">Unified incident queue (Defender portal)</text>
  <text x="750" y="480" font-size="12" fill="#444" text-anchor="middle">single pane: Sentinel + Defender XDR incidents</text>

  <!-- XDR <-> SENTINEL BI-DIRECTIONAL -->
  <line x1="440" y1="250" x2="560" y2="245" stroke="#e8590c" stroke-width="3" marker-end="url(#arrOrange)" marker-start="url(#arrOrangeStart)"/>
  <text x="500" y="225" font-size="12" font-weight="600" fill="#e8590c" text-anchor="middle">bi-directional</text>
  <text x="500" y="278" font-size="11" fill="#e8590c" text-anchor="middle">status · owner ·</text>
  <text x="500" y="293" font-size="11" fill="#e8590c" text-anchor="middle">classification sync</text>

  <!-- RESPONSE BACK TO IDENTITY -->
  <path d="M 855 500 Q 905 640 440 645" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrRed)"/>
  <text x="700" y="638" font-size="12" font-weight="600" fill="#e03131" text-anchor="middle">Automatic attack disruption: disable account</text>
  <text x="700" y="655" font-size="11" fill="#e03131" text-anchor="middle">(Entra ID = cloud · via MDI = on-prem AD DS) · isolate device</text>

  <!-- legend -->
  <rect x="40" y="60" width="920" height="30" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="55" y="80" font-size="12" fill="#495057">Flow: identity sources → detection (MDI / Entra ID Protection) → Defender XDR correlation → Sentinel SIEM · incidents sync both ways · response can disable the identity</text>

  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1e1e1e"/></marker>
    <marker id="arrOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e8590c"/></marker>
    <marker id="arrOrangeStart" markerWidth="11" markerHeight="11" refX="1" refY="3.5" orient="auto"><path d="M9,0 L0,3.5 L9,7 Z" fill="#e8590c"/></marker>
    <marker id="arrRed" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e03131"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#757575"/></marker>
    <marker id="arrGreyStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#757575"/></marker>
  </defs>
</svg>
