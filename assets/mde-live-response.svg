<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="42" font-size="24" font-weight="600" fill="#1e1e1e" text-anchor="middle">Defender for Endpoint: Live Response</text>

  <!-- Portal zone -->
  <rect x="40" y="90" width="290" height="230" rx="14" fill="#dbe4ff" opacity="0.35" stroke="#4a9eed"/>
  <text x="60" y="118" font-size="16" font-weight="600" fill="#2563eb">Microsoft Defender portal</text>
  <rect x="60" y="140" width="250" height="60" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="175" font-size="15" fill="#1e1e1e" text-anchor="middle">Security analyst</text>
  <rect x="60" y="230" width="250" height="65" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="185" y="258" font-size="13" fill="#1e1e1e" text-anchor="middle">Device page &gt;</text>
  <text x="185" y="278" font-size="13" fill="#1e1e1e" text-anchor="middle">Initiate live response session</text>
  <line x1="185" y1="200" x2="185" y2="225" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Cloud channel -->
  <rect x="400" y="180" width="200" height="90" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="215" font-size="14" fill="#1e1e1e" text-anchor="middle">MDE cloud service</text>
  <text x="500" y="237" font-size="13" fill="#444" text-anchor="middle">secure session channel</text>
  <line x1="310" y1="262" x2="395" y2="235" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="220" x2="665" y2="195" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="295" font-size="13" fill="#757575" text-anchor="middle">works even when the device</text>
  <text x="500" y="315" font-size="13" fill="#757575" text-anchor="middle">is network-isolated</text>

  <!-- Device zone -->
  <rect x="660" y="90" width="270" height="480" rx="14" fill="#c3fae8" opacity="0.35" stroke="#0d9488"/>
  <text x="680" y="118" font-size="16" font-weight="600" fill="#0d9488">Onboarded device</text>
  <rect x="680" y="140" width="230" height="55" rx="10" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
  <text x="795" y="173" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Live response shell</text>
  <rect x="680" y="220" width="230" height="65" rx="10" fill="#a5d8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="795" y="248" font-size="13" fill="#1e1e1e" text-anchor="middle">Inspect: processes, dir,</text>
  <text x="795" y="268" font-size="13" fill="#1e1e1e" text-anchor="middle">connections, registry</text>
  <rect x="680" y="305" width="230" height="65" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="795" y="333" font-size="13" fill="#1e1e1e" text-anchor="middle">Collect evidence:</text>
  <text x="795" y="353" font-size="13" fill="#1e1e1e" text-anchor="middle">getfile, analyze</text>
  <rect x="680" y="390" width="230" height="65" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="795" y="418" font-size="13" fill="#1e1e1e" text-anchor="middle">Run: PowerShell scripts</text>
  <text x="795" y="438" font-size="13" fill="#1e1e1e" text-anchor="middle">from the library (putfile, run)</text>
  <rect x="680" y="475" width="230" height="65" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
  <text x="795" y="503" font-size="13" fill="#1e1e1e" text-anchor="middle">Remediate (advanced):</text>
  <text x="795" y="523" font-size="13" fill="#1e1e1e" text-anchor="middle">stopprocess, deletefile</text>

  <!-- Prerequisites -->
  <text x="40" y="400" font-size="14" font-weight="600" fill="#444">Prerequisites</text>
  <text x="40" y="426" font-size="13" fill="#757575">• Advanced features → Live response = ON</text>
  <text x="40" y="448" font-size="13" fill="#757575">• Live response for servers = separate toggle</text>
  <text x="40" y="470" font-size="13" fill="#757575">• Live response unsigned script execution = third toggle</text>
  <text x="40" y="492" font-size="13" fill="#757575">• RBAC: basic vs advanced live response commands</text>
  <text x="40" y="514" font-size="13" fill="#757575">• Every command in a session is logged / auditable</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
